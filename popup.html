<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Twitch Stream</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            padding: 10px;
            width: 300px;
            height: 200px;
        }

        input {
            padding: 8px;
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #333;
            color: white;
        }

        button {
            padding: 8px 20px;
            width: 100%;
            background-color: #6441a5;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #532f8f;
        }

        #currentTabStreamBtn {
            background-color: #3b82f6;
        }

        #currentTabStreamBtn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>Enter Twitch Streamer Name</h1>
    
    <button id="currentTabStreamBtn" style="display: none;"></button>
    
    <!-- User Input -->
    <input type="text" id="streamerInput" placeholder="Enter Twitch name (e.g., caseoh_)">
    <button id="goToStreamBtn">Go to Stream</button>

    <!-- Link to the external JS file -->
    <script src="popup.js"></script>
</body>
</html>
