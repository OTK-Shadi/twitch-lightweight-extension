<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Twitch Stream</title>
    <style>
        :root {
            --bg: #0f0f14;
            --panel: #18181f;
            --panel-border: #272730;
            --text: #f5f5f7;
            --muted: #b8b8c7;
            --purple: #9147ff;
            --purple-hover: #7f39ee;
            --blue: #3b82f6;
            --blue-hover: #2563eb;
            --danger: #ff7a7a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #11111a 0%, #0c0c11 100%);
            color: var(--text);
            padding: 14px;
            width: 340px;
            margin: 0;
        }

        .title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            margin-top: 14px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #6b7280;
            flex-shrink: 0;
        }

        .status.on-twitch .status-dot {
            background: #22c55e;
        }

        .status.off-twitch .status-dot {
            background: #f59e0b;
        }

        .current-stream-card {
            margin-top: 10px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 10px;
            padding: 10px;
            display: none;
        }

        .hint {
            color: var(--muted);
            margin-top: 8px;
            margin-bottom: 0;
            font-size: 12px;
            line-height: 1.4;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-size: 13px;
            color: #e6e6f0;
        }

        input {
            padding: 10px;
            width: 100%;
            border: 1px solid #333341;
            border-radius: 8px;
            background-color: #13131a;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 2px rgba(145, 71, 255, 0.3);
        }

        .error {
            margin-top: 7px;
            min-height: 14px;
            color: var(--danger);
            font-size: 12px;
        }

        button {
            padding: 10px 14px;
            width: 100%;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 600;
        }

        #goToStreamBtn {
            background-color: var(--purple);
        }

        #goToStreamBtn:hover {
            background-color: var(--purple-hover);
        }

        #currentTabStreamBtn {
            background-color: var(--blue);
            margin-top: 0;
        }

        #currentTabStreamBtn:hover {
            background-color: var(--blue-hover);
        }

        .footer {
            margin-top: 12px;
            color: #9b9bae;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="title">Lightweight Twitch Stream</h1>
    <p class="subtitle">Open a clean player in one click.</p>

    <div id="status" class="status off-twitch">
        <span class="status-dot"></span>
        <span id="statusText">Checking your current tab…</span>
    </div>

    <div id="currentStreamCard" class="current-stream-card">
        <button id="currentTabStreamBtn" type="button"></button>
        <p class="hint">Detected from your active Twitch tab.</p>
    </div>

    <label for="streamerInput">Streamer name</label>
    <input type="text" id="streamerInput" placeholder="e.g. caseoh_" autocomplete="off">
    <div id="inputError" class="error"></div>
    <button id="goToStreamBtn" type="button">Open Stream</button>

    <p class="footer">Tip: Works from any page, not only Twitch.</p>

    <script src="popup.js"></script>
</body>
</html>
